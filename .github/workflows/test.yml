name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('app/**/*.gradle', 'cfgdev/cfggen-tools/build.gradle', 'app/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run tests
        working-directory: app
        run: ./gradlew :test :cfggen-tools:test :cfggen-tools:stageJars --no-daemon

      - name: Verify the packaged tools can load cfggen.jar
        run: |
          java -jar cfgdev/cfggen-tools/build/jars/cfggen-tools.jar -tool "csvencoding,datadir=example/config"
          java -jar cfgdev/cfggen-tools/build/jars/cfggen-tools.jar -tool "fastexcelcheck,datadir=example/config"

      - name: Initialize the packaged MCP server
        run: |
          log="$RUNNER_TEMP/cfggen-mcp.log"
          java --sun-misc-unsafe-memory-access=allow -jar cfgdev/cfggen-tools/build/jars/cfggen-tools.jar \
            -datadir example/config -schema example/config -gen mcpserver,port=13457 >"$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          if ! response=$(curl --fail --silent --show-error --max-time 10 --retry 15 --retry-delay 1 --retry-connrefused \
            -H 'Accept: application/json, text/event-stream' -H 'Content-Type: application/json' \
            --data-binary '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            http://127.0.0.1:13457/mcp) || [[ "$response" != *cfg-mcp-server* ]]; then
            cat "$log"
            exit 1
          fi

      - name: Regenerate and check the Java example
        working-directory: example/java
        run: |
          rm -- configgen/genjava/*.java
          java --sun-misc-unsafe-memory-access=allow -jar ../../app/build/libs/cfggen.jar -datadir ../config -gen java,own:-noserver,dir:.,builders:../config/builders.txt,configgendir:.,beautifulName,jspecify
          ../../app/gradlew -p . compileJava --no-daemon

      - name: Regenerate and check the multilingual Java example
        working-directory: example/java_ls
        run: |
          rm -- configgen/genjava/*.java
          java --sun-misc-unsafe-memory-access=allow -jar ../../app/build/libs/cfggen.jar -datadir ../config -langswitchdir ../i18n/langs -gen java,own:-noserver,dir:.,configgendir:.,prefix:Cfg,jspecify
          ../../app/gradlew -p . compileJava --no-daemon

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: example/ts/package-lock.json

      - name: Install TypeScript example dependencies
        working-directory: example/ts
        run: npm ci

      - name: Regenerate TypeScript example
        working-directory: example/ts
        run: java --sun-misc-unsafe-memory-access=allow -jar ../../app/build/libs/cfggen.jar -datadir ../config -gen ts -gen bytes

      - name: Verify TypeScript example
        working-directory: example/ts
        run: npm test

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            app/build/reports/tests/test
            cfgdev/cfggen-tools/build/reports/tests/test
          retention-days: 7
