struct Phase {
    phaseKey:str;
    nextPhaseKey:str ->@StateMachine::phases (nullable);
}

struct StateMachine {
    machineKey:str;
    phases:list<Phase> (index='phaseKey');
    initialPhaseKey:str ->@StateMachine::phases;
}

table ability[id] (json) {
    id:int;
    machines:list<StateMachine> (index='machineKey');
}

struct PhaseTarget {
    phaseKey:str;
    ->target:[@AbilityUse::abilityId,@MachineUse::machineKey,phaseKey]
        ->ability::machines.phases;
}

struct MachineUse {
    machineKey:str;
    targets:list<PhaseTarget>;
}

struct AbilityUse {
    abilityId:int;
    machines:list<MachineUse>;
}

table usage[id] (json) {
    id:int;
    uses:list<AbilityUse>;
}
