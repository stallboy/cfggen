// 内部引用验收：技能状态机、命中窗口、事件时间轴与连招分支。
struct PhaseKey { name:str; variant:int; }
struct Origin { x:int; y:int; }
struct Anchor {}
struct AnchorUse { ->anchor:[] ->@Machine::anchor; }

interface Effect {
    struct Damage { amount:int; }
    struct Heal { amount:int; }
    struct None {}
}
struct Exit { effect:Effect; }

struct Phase {
    key:str;
    next:str ->@Machine::phases (nullable);
    ->exit:[] ->@Machine::onExit.effect;
}
struct Impact { ordinal:int; damage:int; }
struct Frame { tick:long; effect:Effect; }
struct Stance { airborne:bool; effect:Effect; }
struct PhaseVariant { key:PhaseKey; effect:Effect; }
struct Combo { weapon:str; tier:int (server); airborne:bool; effect:Effect; }
struct Marker { key:str; }

struct Machine {
    code:str;
    phases:list<Phase> (index='key');
    impacts:list<Impact> (index='ordinal');
    frames:list<Frame> (index='tick');
    stances:list<Stance> (index='airborne');
    variants:list<PhaseVariant> (index='key');
    combos:list<Combo> (index='weapon,tier,airborne');
    markers:list<Marker> (index='key'); // 未被引用也必须保持唯一。
    anchor:Anchor;
    anchors:list<AnchorUse>;
    onExit:Exit;
    initial:str ->@Machine::phases;
    impact:int ->@Machine::impacts;
    frame:long ->@Machine::frames;
    stance:bool ->@Machine::stances;
    variant:PhaseKey ->@Machine::variants;
    weapon:str;
    tier:int;
    airborne:bool;
    ->combo:[weapon,tier,airborne] ->@Machine::combos;
}

table ability[id] (json) {
    [code]; id:int; code:str;
    origin:Origin;
    machines:list<Machine> (index='code');
    startMachine:str; startPhase:str;
    ->initial:[startMachine,startPhase] ->::machines.phases;
    ->spawn:[] ->::origin;
}

struct Binding { abilityId:int; }
struct PhaseUse {
    phaseKey:str;
    ->target:[@AbilityUse::binding.abilityId,@MachineUse::machineKey,phaseKey] ->ability::machines.phases;
    ->byCode:[::abilityCode,@MachineUse::machineKey,phaseKey] ->ability[code]::machines.phases;
    ->origin:[] ->::origin;
}
struct MachineUse { machineKey:str; targets:list<PhaseUse>; }
struct AbilityUse {
    binding:Binding; machines:list<MachineUse>;
    ->ability:[binding.abilityId] ->ability;
}
struct OptionalAim {
    abilityId:int; machineKey:str; phaseKey:str;
    ->target:[abilityId,machineKey,phaseKey] ->ability::machines.phases (nullable);
}
struct BookEntry { name:str; }
struct Reward { count:int; }

table phasebook[school,tier,airborne] (json) {
    [code,edition]; school:str; tier:int; airborne:bool; code:str; edition:int; entry:BookEntry;
}
table branchreward[key] (json) { key:PhaseKey; reward:Reward; }
table cast[id] (json) {
    id:int; abilityCode:str; origin:Origin; uses:list<AbilityUse>; optional:list<OptionalAim>;
    school:str; tier:int; airborne:bool; bookCode:str; edition:int; rewardKey:PhaseKey;
    ->book:[school,tier,airborne] ->phasebook::entry;
    ->bookByCode:[bookCode,edition] ->phasebook[code,edition]::entry;
    ->bookRecord:[::school,::tier,::airborne] ->phasebook;
    ->reward:[rewardKey] ->branchreward::reward;
}

// CSV pack 映射：五种 map 键、多态 value、无键的 interface 固定终点。
table timeline[id] {
    id:int;
    events:map<PhaseKey,Effect> (pack);
    channels:map<str,Effect> (pack);
    slots:map<int,Effect> (pack);
    clock:map<long,Effect> (pack);
    modes:map<bool,Effect> (pack);
    eventKey:PhaseKey ->::events (pack);
    channel:str ->::channels;
    slot:int ->::slots;
    frame:long ->::clock;
    airborne:bool ->::modes;
    fallback:Effect (pack);
    ->default:[] ->::fallback;
}

// 递归行为树：最近的内层状态机缺少 Done 时，Jump 不回退到外层。
interface Command {
    struct StateMachine { phases:list<NestedPhase> (index='key'); }
    struct Jump { key:str ->@Command.StateMachine::phases (nullable); }
    struct Noop {}
}
struct NestedPhase { key:str; action:Command; }
table encounter[id] (json) { id:int; command:Command; }
