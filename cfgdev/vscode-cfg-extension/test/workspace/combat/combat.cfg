// 🧙 The local type must not shadow the root table.
struct ability { id:int; }
struct Use (note='😀') { first:AbilityUse; second:MachineUse; key:str ->@Command.StateMachine::phases; }
struct Binding {
    abilityId:int; machineKey:str; phaseKey:str;
    ->target:[@AbilityUse::abilityId,@MachineUse::machineKey,phaseKey]
        ->ability[code]::machines.phases;
    ->root:[::machineKey,phaseKey] ->::machines.phases;
    ->fixed:[] ->::origin;
    legacy:int ->ability;
}
