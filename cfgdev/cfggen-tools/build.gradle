plugins {
    id 'application'
}

repositories {
    maven { url = uri('https://maven.aliyun.com/repository/central') }
    mavenCentral()
}

configurations {
    bundledTools {
        canBeConsumed = false
    }
    implementation.extendsFrom(bundledTools)
}

dependencies {
    implementation project(':')
    implementation 'org.jspecify:jspecify:1.0.0'
    // The app project supplies POI's transitive dependencies at runtime.
    implementation("org.apache.poi:poi:${rootProject.poiVersion}") { transitive = false }
    testCompileOnly("org.apache.poi:poi-ooxml:${rootProject.poiVersion}") { transitive = false }
    compileOnly "com.alibaba.fastjson2:fastjson2:${rootProject.fastjson2Version}"
    bundledTools 'com.ibm.icu:icu4j:72.1'
    bundledTools platform("com.fasterxml.jackson:jackson-bom:${rootProject.jacksonVersion}")
    bundledTools('io.github.codeboyzhou:mcp-declarative-java-sdk:0.9.0') {
        // cfggen.jar already provides these libraries for Simple OpenAI.
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'configgen.tool.ToolsMain'
}

tasks.named('test') {
    useJUnitPlatform()
}

def bundledTools = configurations.bundledTools
def toolsJar = tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Build the cfggen tools JAR with ICU4J and MCP dependencies'
    archiveFileName = 'cfggen-tools.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from sourceSets.main.output
    from({ bundledTools.collect { zipTree(it) } }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
    manifest {
        attributes 'Main-Class': application.mainClass.get(), 'Class-Path': 'cfggen.jar'
    }
}

def cfggenJar = rootProject.tasks.named('fatJar', Jar)
tasks.register('stageJars', Sync) {
    group = 'build'
    description = 'Put cfggen.jar and cfggen-tools.jar in the same directory'
    from cfggenJar.flatMap { it.archiveFile }
    from toolsJar.flatMap { it.archiveFile }
    into layout.buildDirectory.dir('jars')
}
